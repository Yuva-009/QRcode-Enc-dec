<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan and Decrypt QR Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #d9d9d9;
    }
    .wrapper {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      padding: 20px;
      max-width: 90%;
      width: 400px;
      text-align: center;
    }
    textarea, input[type="password"], input[type="file"] {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      width: 90%;
      margin: 10px 0;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
      font-size: 14px;
      resize: vertical;
    }
    video {
      display: none;
      margin: 10px 0;
      border-radius: 8px;
      width: 300px;
      height: 300px;
      object-fit: cover;
    }

    /* Fancy button styles */
    .fancy-button {
      position: relative;
      display: inline-block;
      font-weight: 600;
      color: white;
      background-color: #171717;
      border-radius: 1rem;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.3s ease-in-out;
      width: 100%;
      max-width: 400px;
      margin: 12px auto;
      user-select: none;
    }
    .fancy-button:hover {
      transform: scale(1.05);
    }
    .fancy-button:active {
      transform: scale(0.95);
    }
    .fancy-button span.bg {
      position: absolute;
      inset: 0;
      border-radius: 1rem;
      padding: 2px;
      opacity: 0;
      background: linear-gradient(to right, #10b981, #06b6d4, #0ea5e9);
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .fancy-button:hover span.bg {
      opacity: 1;
    }
    .fancy-button span.content {
      position: relative;
      display: block;
      background-color: #0a0a0a;
      border-radius: 1rem;
      padding: 1rem 2rem;
      z-index: 10;
      font-size: 16px;
    }
    .fancy-button .inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: white;
      transition: all 0.5s ease;
    }
    .fancy-button:hover .inner {
      transform: translateX(6px);
      color: #34d399;
    }
    svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/crypto-js.js"></script>
  <script src="https://cdn.rawgit.com/cozmo/jsQR/master/dist/jsQR.js"></script>
</head>
<body>
  <div class="container">
    <div class="wrapper">
      <h2>Scan and Decrypt QR Code</h2>

      <input type="file" accept="image/*" onchange="handleFile(event)" />

      <video id="camera"></video>

      <!-- Scan QR Code Button -->
      <div class="fancy-button" onclick="startCamera()">
        <span class="bg" style="background: linear-gradient(to right, #ec4899, #f87171, #fbbf24);"></span>
        <span class="content">
          <div class="inner">
            <span>Scan QR Code with Camera</span>
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z" />
            </svg>
          </div>
        </span>
      </div>

      <textarea id="scannedText" placeholder="Scanned encrypted text will appear here..." readonly rows="3"></textarea>
      <textarea id="manualEncryptedText" placeholder="Or manually enter encrypted text here..." rows="3"></textarea>
      <input type="password" id="key" placeholder="Enter decryption key" />

      <!-- Decrypt Button -->
      <div class="fancy-button" onclick="decryptText()">
        <span class="bg" style="background: linear-gradient(to right, #10b981, #06b6d4, #0ea5e9);"></span>
        <span class="content">
          <div class="inner">
            <span>DECRYPT</span>
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z" />
            </svg>
          </div>
        </span>
      </div>

      <textarea id="decryptedText" placeholder="Decrypted text will appear here..." readonly rows="4"></textarea>
    </div>
  </div>

  <script>
    const video = document.getElementById("camera");
    let scannedText = "";

    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) {
            document.getElementById("scannedText").value = code.data;
            scannedText = code.data;
          } else {
            alert("No QR code found in the image.");
          }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          video.srcObject = stream;
          video.style.display = "block";
          video.play();
          scanQRCode();
        })
        .catch(err => alert("Camera access denied: " + err.message));
    }

    function scanQRCode() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const scan = () => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) {
            document.getElementById("scannedText").value = code.data;
            scannedText = code.data;
            stopCamera();
          }
        }
        requestAnimationFrame(scan);
      };
      scan();
    }

    function stopCamera() {
      const stream = video.srcObject;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.style.display = "none";
      }
    }

    function decryptText() {
      const secretKey = document.getElementById("key").value.trim();
      const manualInput = document.getElementById("manualEncryptedText").value.trim();
      const textToDecrypt = manualInput || scannedText;

      if (!textToDecrypt) {
        alert("Please provide encrypted text (scan or manual).");
        return;
      }
      if (!secretKey) {
        alert("Please enter a decryption key.");
        return;
      }

      try {
        const bytes = CryptoJS.AES.decrypt(textToDecrypt, secretKey);
        const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
        document.getElementById("decryptedText").value = decryptedText || "Decryption failed.";
      } catch (e) {
        document.getElementById("decryptedText").value = "Invalid encrypted text or key!";
      }
    }
  </script>
</body>
</html>
