<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px; }
        .container { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #d9d9d9; }
        .wrapper { background: #fff; border-radius: 10px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); padding: 20px; max-width: 90%; width: 400px; text-align: center; }
        input[type="submit"], button { background-color: #28a745; color: #fff; border: none; border-radius: 8px; padding: 10px; margin: 10px 0; cursor: pointer; width: 90%; }
        textarea, input[type="password"] {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            width: 90%;
            margin: 10px 0;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }
        button.copy-btn { background-color: #007bff; }
        button:hover, input[type="submit"]:hover { opacity: 0.9; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
    <script src="https://rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <textarea id="text" placeholder="Enter text here..."></textarea>
            <input type="password" id="key" placeholder="Enter encryption key">
            <input type="submit" value="GENERATE QR CODE" onclick="generateQRCode()">
            <div id="qrcode"></div>
            <button class="copy-btn" onclick="copyEncryptedText()">Copy Encrypted Text</button>
        </div>
    </div>
    <script>
        let encryptedText = "";

        function generateQRCode() {
            const mytext = document.getElementById("text").value;
            const secretKey = document.getElementById("key").value;
            const qrcodeContainer = document.getElementById("qrcode");
            qrcodeContainer.innerHTML = "";

            if (mytext && secretKey) {
                encryptedText = CryptoJS.AES.encrypt(mytext, secretKey).toString();
                new QRCode(qrcodeContainer, { text: encryptedText, width: 200, height: 200 });
            } else {
                alert("Please enter text and a key.");
            }
        }

        function copyEncryptedText() {
            if (encryptedText) {
                navigator.clipboard.writeText(encryptedText)
                    .then(() => alert("Encrypted text copied to clipboard!"))
                    .catch(err => console.error("Failed to copy text:", err));
            } else {
                alert("No encrypted text to copy!");
            }
        }
    </script>
</body>
</html>
